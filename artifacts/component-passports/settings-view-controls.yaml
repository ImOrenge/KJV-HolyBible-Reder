component:
  id: settings-view-controls
  status: verified
  owner_scope: screen-component-port
  source:
    repo: D:\kjv-educator
    path: apps/web/src/components/kjv-mvp-app.tsx
    route: /app
    baseline_component: "Settings menu, account controls, TTS controls, text controls, view controls"
  target:
    expo:
      path: apps/mobile/App.tsx
      surface: "Expo React Native app and Expo Web parity surface"
    shared:
      settings_model: packages/shared/src/types.ts
      persistence: packages/shared/src/user-data-repository.ts
  dependencies:
    shared_types:
      - UserDataState
      - ReadingMode
      - TranslationLanguage
    runtime_adapters:
      speech: expo-speech
      storage: AsyncStorage via shared repository normalization
      native_input: React Native TextInput
  ported_behavior:
    - "Settings menu exposes account, TTS, text, and view sections matching the web mobile source."
    - "TTS section now includes voice selection, speed options, repeat, auto-scroll, current chapter playback, pause/resume, stop, and playback status."
    - "Expo speech calls use selected voice, reading language, speed, repeat, and lifecycle callbacks."
    - "Text section preserves font size and line-height controls using native step buttons."
    - "View section preserves reading mode, reading language, theme toggle, and simulator API base URL controls."
  evidence:
    - type: typecheck
      command: npm run typecheck
      result: pass
    - type: structure
      command: npm run structure:mobile
      result: pass
    - type: style
      command: npm run style:mobile
      result: pass
    - type: browser-flow
      command: npm run browser:mobile -- --web-url=http://localhost:3001/app --mobile-url=http://localhost:8082 --width=390 --height=844
      result: pass
    - type: visual-diff
      command: npm run visual:mobile:all -- --states=settings,settingsTts,settingsText,settingsView --web-url=http://localhost:3001/app --mobile-url=http://localhost:8082 --width=390 --height=844
      result: pass
      states: 4
      ratios:
        settings: 0.0907
        settingsTts: 0.1276
        settingsText: 0.0976
        settingsView: 0.1208
    - type: expo-native-interaction
      command: npm run audit:mobile-clicks
      result: pass
      steps: 27
  divergence:
    intentional:
      - "Expo Native renders web select/range controls as native chips and buttons to preserve touch ergonomics while keeping option values and settings state equivalent."
      - "Expo Speech pause/resume is platform-dependent; the control reports unsupported pause behavior through status text when native runtime does not provide it."
    unresolved: []
  next_action:
    type: port-next-component
    candidates:
      - highlight-library-filters
