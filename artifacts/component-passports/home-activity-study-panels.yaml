          - .tmp/mobile-click-audit/native-home-study-expo-after-outline-patch.png
        findings:
          - activity tab rendered recent activity panel with populated read, highlight, citation, and read rows
          - study tab rendered recent highlights, recent citations, and notes with tags panels
