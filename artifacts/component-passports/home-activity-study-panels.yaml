component:
  id: home-activity-study-panels
  status: verified
  owner_scope: component-port
  source:
    app: apps/web
    path: apps/web/src/components/kjv-mvp-app.tsx
    surface: /app home activity and study tabs at 390x844
  target:
    app: apps/mobile
    path: apps/mobile/App.tsx
    surface: Expo home activity and study tabs
  component_kind: feature-composite
  change_gate: style-contract
  ported_behavior:
    - Home activity renders a recent activity panel matching the web mobile section label and empty state.
    - Activity items combine recent reads, highlights, favorite verses, and study notes, sorted newest first.
    - Home study renders the same three web sections: recent highlights, recent citations, and notes with tags.
    - Highlight, citation, activity, and note rows navigate back to the relevant reader target or note modal.
  states:
    required:
      - homeActivity
      - homeStudy
    verified:
      - activity populated or empty state
      - recent highlight list
      - recent citation list
      - note empty state
  dependencies:
    internal:
      - UserDataState.highlights
      - UserDataState.favoriteVerses
      - UserDataState.recentReads
      - UserDataState.studyNotes
      - UserDataState.tags
    external:
      - react-native
      - "@expo/vector-icons/Ionicons"
  evidence:
    current_level: 5
    items:
      - type: typecheck
        command: npm run typecheck
        result: pass
      - type: structure-parity
        command: npm run structure:mobile
        result: pass
      - type: style-parity
        command: npm run style:mobile
        result: pass
      - type: browser-smoke
        command: npm run browser:mobile -- --web-url=http://localhost:3001/app --mobile-url=http://localhost:8082 --width=390 --height=844
        result: pass
      - type: visual-diff
        command: npm run visual:mobile:all -- --states=homeActivity,homeStudy --web-url=http://localhost:3001/app --mobile-url=http://localhost:8082 --width=390 --height=844
        result: pass
        artifact: .tmp/visual-parity/visual-parity-report.json
        findings:
          - homeActivity changedRatio 0.0453 meanDiff 0.0356
