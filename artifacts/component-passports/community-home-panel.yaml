component:
  id: community-home-panel
  status: implemented
  owner_scope: qt-social-community
  source:
    web_route: apps/web/src/app/community
    web_components: apps/web/src/components/community-social
    web_repository: apps/web/src/lib/community-v2-server.ts
    expo: apps/mobile/src/community-home-panel.tsx
    shared_contract: packages/shared/src/community.ts
    shared_modules: packages/shared/src/community
    database: supabase/migrations/20260723134346_qt_social_community_v2.sql
    onboarding_sync: supabase/migrations/20260725020622_sync_community_profile_onboarding.sql
    public_read_hardening: supabase/migrations/20260725025500_harden_community_public_read_policies.sql
    legacy_retirement: supabase/migrations/20260728143000_retire_legacy_community_channel.sql
    legacy_graceful_read: supabase/migrations/20260729030757_retire_legacy_community_rls_fallback.sql
  component_kind: feature
  change_gate:
    type: behavioral
    summary: Replaces the authenticated ranking-oriented QT discussion panel with a public SNS using recommendation, following, search, likes, comments, reposts, notifications, and moderation.
    migration: /app/community and /app?view=community redirect to /community; the reader exposes only a direct bottom-sidebar link to the canonical route, legacy UI entries are removed, and legacy APIs return 410 while archived tables expose no rows or mutations through default-deny RLS.
  public_api:
    props:
      - currentReference
      - accessToken
      - apiBaseUrl
      - onBack
      - onLogin
      - onOpenReader
    routes:
      web:
        - /community
        - /community/post/[postId]
        - /community/u/[handle]
        - /community/hashtag/[tag]
        - /community/verse/[verseKey]
        - /community/search
        - /community/notifications
        - /community/settings
        - /community/moderation
      mobile: /community
      api: /api/community/v2/[...segments]
  identity_contract:
    authoritative_source: public.user_profiles onboarding data
    synchronized_fields:
      - nickname -> display_name
      - avatar_path -> avatar_path
      - honorific -> honorific
    community_editable_fields:
      - handle
      - bio
      - public_enabled
      - show_honorific
    enforcement:
      - accounts without completed onboarding cannot create a community profile
      - display name, avatar, and honorific cannot fall back to auth metadata
      - onboarding edit mode is the only UI that changes projected identity fields
  state:
    required:
      - anonymous public recommendation and latest feed
      - authenticated recommendation, following, and latest feed
      - cursor loading, loading, empty, and error states
      - composer with one to ten verses, one optional image, and up to five hashtags
      - post and comment edit, delete, and edited label
      - one-level reply, mention, post like, comment like, repost, and quote repost
      - public profile, follow, mute, block, and explicit public enablement
      - post, user, verse, and hashtag search
      - in-app notification, read state, Expo token registration, and notification-open routing
      - report confirmation, moderation queue, action, restriction, and audit event
      - explicit mobile back with Today fallback
  accessibility_contract:
    - feed modes expose tab and selected state semantics
    - buttons and pressables use visible command text or explicit accessibility labels
    - status and error messages use live-region semantics where supported
    - forms keep associated labels and keyboard-safe modal surfaces
    - owner edit and delete actions are distinct from report actions
  layout_contract:
    benchmark: Meta Threads desktop and mobile information architecture
    desktop:
      - fixed left navigation with text labels
      - guest login is grouped with the Bible reader link at the bottom of the fixed rail
      - centered 640px continuous feed column
      - intentionally empty right-side breathing room on the home feed
      - inline composer trigger followed by underline feed tabs
      - posts separated by rules rather than floating cards
      - profile identity, counts, full-width owner action, and four content tabs follow the Threads hierarchy
      - owner profile editing opens as a centered dialog while /community/settings remains the direct-route fallback
    mobile:
      - compact sticky header and five-action bottom navigation
      - edge-to-edge continuous feed
      - profile editing becomes a safe-area-aware bottom sheet with a sticky completion action
    exclusions:
      - promotional or guidance cards beside the home feed
      - permanently open composer dialog
      - DM and group navigation
    style_change_gate:
      type: style-contract
      updated_at: 2026-07-30
  web_component_surfaces:
    - name: CommunityPageHeader
      kind: feature-layout
      contract: shared centered-column title, subtitle, leading, and action slots
    - name: CommunityComposer
      kind: feature-form-dialog
      contract: closed by default, explicit query or trigger open, session draft, chapter-table verse selection, verse and body validation, image and comment policy tools
    - name: CommunityVersePicker
      kind: feature-combobox
      contract: canonical 66-book chooser, Korean and English book aliases, paginated whole-book verses from 1:1, chapter-focused verse tables, input-matched verse promotion and emphasis, one-to-ten multi-selection, keyboard navigation, and canonical verse-key output
    - name: CommunitySearchForm
      kind: feature-form
      contract: GET URL state for q and all, posts, users, verses, and tags filters
    - name: CommunityProfileResultRow
      kind: data-display
      contract: public onboarding-matched profile summary with reusable follow action
    - name: CommunityActivityFilter
      kind: feature-control
      contract: URL-backed all, follows, replies, mentions, quotes, reposts, and likes filters
    - name: CommunityProfileHeader
      kind: feature-composite
      contract: onboarding-authoritative identity, profile counts, owner edit, follow, and safety overflow
    - name: CommunityProfileEditDialog
      kind: feature-form-dialog
      contract: native dialog opened from the owner profile, backdrop and escape dismissal, onboarding identity handoff, save refresh, and mobile bottom-sheet layout
    - name: CommunityProfileEditor
      kind: feature-form
      contract: page and dialog modes for editable handle, bio, honorific visibility, and public scope; display name and avatar remain onboarding-owned
    - name: CommunityProfileCompletion
      kind: feedback
      contract: horizontally scrollable cards derived only from real incomplete profile actions
  css_contract:
    file: apps/web/src/app/community/community-social.css
    namespace: community-
    additive_namespaces:
      - community-page-header
      - community-search-
      - community-activity-
      - community-composer-
      - community-verse-picker-
      - community-profile-
    inline_styles_allowed: false
    hard_coded_brand_colors_allowed: false
  color_contract:
    source: apps/web/src/app/globals.css
    mappings:
      background: --bg
      surface: --surface
      secondary_surface: --surface-2
      text: --text
      muted_text: --muted
      border: --line
      action: --accent
      action_contrast: --accent-contrast
      danger: --danger
      elevation: --shadow
    rule: Threads is used only for layout and interaction hierarchy; all visual colors inherit the KJV app theme.
  privacy_contract:
    - onboarding display name, avatar, and honorific remain authoritative
    - a community profile is public only after explicit public_enabled consent and handle creation
    - only content explicitly entered in the community composer is published
    - personal notes, highlights, and reading history are never imported by feed or search code
    - block, mute, profile status, post status, and moderation filters run before feed and search output
    - account deletion removes relations, notifications, stored media, and identifiers while retaining only non-public anonymous post and comment tombstones required by referential integrity
    - DM, groups, private accounts, and public ranking are absent from the v2 product contract
    - legacy discussion and ranking tables are retained only as a private archive with no RLS policies or mutation grants; authenticated SELECT returns empty results for stale clients
  validation:
    required:
      - workspace typecheck and lint
      - Next production build
      - Supabase migration push and RLS inspection
      - anonymous and authenticated Community v2 API smoke
      - recommendation, following, latest, cursor, mute, and block checks
      - post, profile, verse, and hashtag search checks
      - onboarding profile synchronization check
      - account cleanup with no retained smoke users or media
      - Expo doctor and native structure contract
      - desktop and mobile viewport browser smoke
  evidence:
    current_level: 2
    updated_at: 2026-07-30
    items:
      - type: legacy-retirement
        command: supabase db push --linked, npm run db:smoke-community:v2, and local HTTP route smoke
        result: pass
        finding: legacy APIs return 410 with a v2 successor link, /app/community redirects to /community, v2 feed remains public, archived rows and mutations remain denied, and stale authenticated SELECT requests receive empty results instead of raw permission errors
      - type: migration
        command: supabase db push --linked
        result: pass
        finding: additive community v2 and onboarding synchronization migrations were applied to the linked project
      - type: static-validation
        command: npm run typecheck, npm run lint, and npm run build
        result: pass
        finding: shared, Expo, and web types plus lint pass and the Next 16.2.11 production build exposes all public community routes
      - type: database-smoke
        command: npm run db:smoke-community:v2
        result: pass
        finding: onboarding identity sync, posts, verses, comments, likes, reposts, relations, notifications, moderation, revisions, RLS, and the absence of DM and group tables pass in a rolled-back remote transaction
      - type: expo-validation
        command: npm run expo:doctor and npm run structure:mobile
        result: pass
        finding: Expo Doctor passes 20 of 20 checks and the native QT social structure contract has no missing controls
      - type: authenticated-api
        command: npm run smoke:community:v2
        result: blocked
        finding: local SUPABASE_SERVICE_ROLE_KEY is a placeholder; the script exited before creating any test user
      - type: threads-layout-web
        command: npm run typecheck, npm run lint, npm run build, and desktop/mobile in-app browser verification
        result: pass
        finding: search, activity filters, onboarding-matched profile, closed-by-default composer, app-color CSS contract, 640px desktop column, and mobile navigation render without horizontal overflow
      - type: public-search-permissions
        command: supabase db push --linked and npm run db:smoke-community:v2
        result: pass
        finding: normalized public search columns are granted to anon and authenticated roles while private honorific controls remain unavailable to anon
      - type: desktop-guest-login-placement
        command: web typecheck, lint, build, and in-app browser DOM plus visual verification
        result: pass
        finding: the desktop primary community menu has no login entry, while Bible reader and guest login links remain visible together at the bottom of the fixed rail; mobile login routes remain unchanged
      - type: threads-profile-uiux
        command: npm run typecheck, npm run lint, npm run build, and in-app browser DOM plus visual verification
        result: pass
        finding: the public profile uses a Threads-inspired identity hierarchy and four-tab content rail, while the owner action opens a centered app-themed edit dialog with onboarding-owned identity, editable handle and bio, accessible switches, sticky completion action, and no browser console errors
      - type: community-verse-picker
        command: chapter-table API probes, npm run typecheck, npm run lint, npm run build, and in-app browser DOM plus visual and keyboard verification
        result: pass
        finding: focusing an empty picker exposes all 66 canonical books in order, gen and 창세기 begin the complete Genesis table at 1:1 with paginated continuation through all 50 chapters, a subsequent 2:5 query preserves the book context and opens all 25 verses of Genesis 2 with 2:5 promoted and emphasized, mouse and ArrowDown plus Enter selection create canonical removable verse chips, and the legacy reference-suggestion mode remains unchanged
  next_action:
    type: environment-and-device-validation
    target: provide the real server-only service role key, rerun Community v2 API smoke, then verify push and keyboard behavior on Android and iOS
