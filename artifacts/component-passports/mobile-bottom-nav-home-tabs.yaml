component:
  id: mobile-bottom-nav-home-tabs
  status: verified
  owner_scope: mobile-navigation-parity
  source:
    repo: apps/web
    path: apps/web/src/components/kjv-mvp-app.tsx
    style:
      - apps/web/src/app/globals.css
    routes:
      - /app
  target:
    expo:
      path: apps/mobile/App.tsx
      surface: bottom tab bar and dashboard home tab segment
      native_mode: native
  change_gate:
    type: style-contract
    summary: Expo bottom navigation item width and label sizing now follow the web mobile grid gap and compact label contract.
  dependencies:
    components:
      - TabButton
      - HomeTabButton
      - Icon
    runtime:
      - react-native Pressable
      - react-native SafeAreaView
    styles:
      - tabBar
      - tabButton
      - tabLabel
      - homeSegment
      - homeTabButton
      - homeTabText
  states:
    required:
      - home tab active
      - reader tab active
      - favorites tab active
      - quick move active
      - settings tab active
      - dashboard today tab
      - dashboard progress tab
      - dashboard activity tab
      - dashboard study tab
  parity_contract:
    visible_actions:
      - 홈
      - 성경
      - 인용
      - 빠른이동
      - 설정
      - 오늘
      - 통독
      - 활동
      - 공부
    layout:
      - bottom navigation uses five equal columns with 4px gaps and 48px minimum hit targets
      - home tab segment uses four equal columns with 4px gaps and 44px minimum hit targets
      - active items use the surfaceStrong/accentSoft filled state and text color promotion
    intentional_divergence:
      - target: expo-native
        reason: Expo Native keeps local text glyphs while Expo Web uses the SVG icon adapter; label order, hit targets, and active states match.
  evidence:
    current_level: 5
    updated_at: 2026-07-08T18:46:12+09:00
    items:
      - type: static
        command: npm run typecheck
        result: pass
      - type: structure
        command: npm run structure:mobile
        result: pass
        finding: mobile-bottom-nav and home-tabs labels present
      - type: style
        command: npm run style:mobile
        result: pass
      - type: visual-diff
        command: npm run visual:mobile:all -- --states=home,homeActivity,homeStudy --web-url=http://localhost:3001/app --mobile-url=http://localhost:8082 --width=390 --height=844
        result: pass
        before:
          home_diff_ratio: 0.1285
          home_activity_diff_ratio: 0.0483
          home_study_diff_ratio: 0.0833
        after:
          home_diff_ratio: 0.1277
          home_activity_diff_ratio: 0.0475
          home_study_diff_ratio: 0.0826
        artifacts:
          - .tmp/visual-parity/home-web.png
          - .tmp/visual-parity/home-mobile.png
          - .tmp/visual-parity/homeActivity-web.png
          - .tmp/visual-parity/homeActivity-mobile.png
          - .tmp/visual-parity/homeStudy-web.png
          - .tmp/visual-parity/homeStudy-mobile.png
          - .tmp/visual-parity/visual-parity-report.json
      - type: runtime-adapter
        command: "Expo Web bundle probe against http://localhost:8083"
        result: pass
        finding: webIconShapes/viewBox SVG adapter is present in the Expo Web bundle; native fallback remains text-backed.
      - type: browser-smoke
        command: npm run browser:mobile -- --web-url=http://localhost:3001/app --mobile-url=http://localhost:8082 --width=390 --height=844
        result: pass
        finding: bottom nav item widths match web at 71px after adding the Expo tabBar gap
      - type: native-screenshot-smoke
        command: adb tap sequence against Expo Go after latest bundle reload
        result: pass
        artifacts:
          - .tmp/mobile-click-audit/manual-home-tabs-bottom-nav.png
          - .tmp/mobile-click-audit/manual-bottom-nav-home-tabs.png
  divergence:
    intentional:
      - id: expo-native-text-backed-icons
        target: expo-native
        reason: Expo Native uses local text glyphs while Expo Web uses the SVG icon adapter; labels, active states, and hit targets are preserved.
    unresolved: []
  next_action:
    type: continue-loop
    target: next unverified mobile component
