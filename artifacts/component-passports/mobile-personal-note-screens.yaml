component:
  id: mobile-personal-note-screens
  name: Mobile Personal Note Screens
  kind: feature-screens
  status: candidate
  change_gate: behavioral
  owner_scope: mobile-personal-notes
  source:
    list_screen: apps/mobile/src/components/notes/personal-note-list-screen.tsx
    editor_screen: apps/mobile/src/components/notes/personal-note-editor-screen.tsx
    rich_text_editor: apps/mobile/src/components/personal-note-rich-text-editor.tsx
    draft_storage: packages/shared/src/personal-note-draft.ts
    remote_client: packages/shared/src/personal-note-client.ts
    navigation: apps/mobile/src/hooks/use-mobile-study-navigation.ts
    integration: apps/mobile/App.tsx
  public_api:
    list_props: [notes, query, totalCount, onCreate, onOpen, onQueryChange, onBack]
    editor_props: [note, title, document, tags, links, saveStatus, saveStatusTone, saveDisabled, conflictRevision, onSave, onDelete, onBack, onOpenLinkedVerse, onUseServerVersion, onKeepLocalDraft]
    rich_text_editor_props: [document, onChange, onAddVerseReference]
  styling:
    system: react-native StyleSheet
    tokens: [accent, accentText, border, danger, muted, surface, surfaceStrong, text]
    inline_styles_allowed: false
  state:
    controlled: [query, title, document, tags]
    local: [advancedToolsOpen, draftHydration, draftDebounceStatus, remoteSaveStatus, revisionConflict]
    external_store: [AsyncStorage note draft, Supabase user snapshot, versioned personal-note API]
  accessibility:
    screen_roots: [노트 목록 화면, 노트 편집 화면]
    back_control: 노트 편집기 이전 화면
    toolbar_roots: [노트 기본 서식 도구, 노트 고급 서식 도구]
    toolbar_toggle: [노트 서식 더보기, 노트 고급 서식 닫기]
    live_region: 노트 저장 상태
    conflict_alert: 노트 저장 충돌
    controls: native Pressable and TextInput roles with explicit labels
  owns:
    - personal note list search and empty state presentation
    - full-screen personal note editor presentation
    - title, structured document, tag, linked verse, save, and delete controls
    - list and editor accessibility screen identities
    - compact primary formatting toolbar and horizontally scrollable advanced formatting toolbar
    - TenTap keyboard avoidance and editor bottom padding contract
    - per-user and per-note local draft debounce, restore, and covered-draft cleanup
    - account deletion and local reset cleanup for indexed and orphaned user draft keys
    - local draft and remote sync state presentation in the editor header
    - explicit server-version and local-draft conflict resolution actions
  does_not_own:
    - note persistence and Supabase synchronization
    - route transition implementation
    - linked verse inspector sheet
  rendering_contract:
    - a notes root route renders PersonalNoteListScreen only
    - a notes route with noteId renders PersonalNoteEditorScreen only
    - selecting or creating a note pushes a note detail route
    - editor back pops to the list and a pushed list can pop to its source Reader
    - deleting an open note removes its memberships and returns to the list
    - leaving the editor clears in-memory fields and reopening rehydrates a newer AsyncStorage draft
    - a 409 revision conflict keeps the local draft and disables save until the user chooses a resolution action
    - choosing the server version replaces only the conflicted note domain and keeps unrelated local state
  editor_contract:
    - TenTap receives the shared PersonalNoteDocument JSON model
    - CSS injection waits for bridge isReady to prevent WebView initialization races
    - TenTap avoidIosKeyboard is enabled for both iOS and Android scroll-threshold handling
    - a dedicated KeyboardAvoidingView docks the compact toolbar at the editor bottom
    - primary formatting tools remain visible while advanced structure, color, alignment, and template tools are opt-in
    - inline verse autocomplete continues to call the existing verse-link callback
  test_surface:
    static: [npm run typecheck, npm run structure:mobile, npm run note-draft:validate, npm run note-client:validate, npm run note-privacy:validate, npm run note-snapshot:validate]
    runtime: [npm run browser:reader -- --single=true --port=9366 --mobile-url=http://127.0.0.1:8083 --web-url=http://127.0.0.1:3002/app, npm run db:smoke-notes]
  evidence:
    - type: browser-interaction
      command: npm run browser:reader -- --single=true --port=9366 --mobile-url=http://127.0.0.1:8083 --web-url=http://127.0.0.1:3002/app
      result: pass
      findings:
        - Reader command search pushes the personal note list
        - creating a note pushes the editor screen
        - list and editor accessibility roots are never rendered together
        - compact toolbar is present and advanced toolbar opens and closes without leaving the editor
        - an unsaved title edit reaches local draft saved state and is restored after editor unmount and reopen
        - editor back restores the list and list back restores Genesis 1 Reader
        - Reader chapter, context sheet, and selection checks remain green
    - type: remote-database
      command: npm run db:smoke-notes
      result: pass
      findings:
        - snapshot replacement preserves the versioned note row and revision history
        - note, revision, and note-link reads remain isolated across accounts
  residual_risk:
    - The conflict band is covered by type and structure checks, but a live two-device authenticated interaction still needs device evidence.
    - Android and iOS device keyboard, IME, toolbar position, and long-document performance still require physical-device verification.
