component:
  id: search-results-and-filter-sheets
  status: verified
  owner_scope: screen-component-port
  source:
    repo: D:\kjv-educator
    path: apps/web/src/components/kjv-mvp-app.tsx
    route: /app
    baseline_component: "Bible search panel, language/sort/testament/book filters, result highlighting"
  target:
    expo:
      path: apps/mobile/App.tsx
      surface: "Expo React Native app and Expo Web parity surface"
    shared:
      api_client: packages/shared/src/bible-client.ts
      highlighting: packages/shared/src/search-highlight.ts
      search_types: packages/shared/src/korean-search.ts
  dependencies:
    shared_types:
      - BibleSearchLanguage
      - BibleSearchSort
      - TranslationLanguage
      - Verse
    runtime_adapters:
      search_api: createBibleApiClient.searchBibleVerses
      native_input: React Native TextInput
      native_filter_control: Pressable select sheet
  ported_behavior:
    - "Search query debounces and calls the shared Bible API with language, sort, testament, and book filters."
    - "Language, sort, testament, and book controls expose the same option set as the web mobile view."
    - "Changing testament resets the book filter to all, matching the web source behavior."
    - "Search results open the reader at the selected verse."
    - "Search result text is rendered in English when search language is KJV English, matching the web source and preserving query highlighting."
    - "Korean and English search result text both use shared collectSearchHighlightRanges highlighting."
  evidence:
    - type: typecheck
      command: npm run typecheck
      result: pass
    - type: structure
      command: npm run structure:mobile
      result: pass
    - type: style
      command: npm run style:mobile
      result: pass
    - type: browser-flow
      command: npm run browser:mobile -- --web-url=http://localhost:3001/app --mobile-url=http://localhost:8082 --width=390 --height=844
      result: pass
      finding: "Flow selects KJV English and verifies an English result contains 'In the beginning'."
    - type: visual-diff
      command: npm run visual:mobile:all -- --states=search,searchResults,searchEnglishResults --web-url=http://localhost:3001/app --mobile-url=http://localhost:8082 --width=390 --height=844
      result: pass
      states: 3
      ratios:
        search: 0.0749
        searchResults: 0.097
        searchEnglishResults: 0.1007
    - type: expo-native-interaction
      command: npm run audit:mobile-clicks
      result: pass
      steps: 27
  divergence:
    intentional:
      - "Expo Native uses React Native select sheets for filter choices instead of browser-native select popups; closed controls and option behavior are verified."
      - "Expo Native pixel parity remains interaction-level for native controls while Expo Web carries the visual diff evidence."
    unresolved: []
  next_action:
    type: port-next-component
    candidates:
      - settings-view-controls
      - highlight-library-filters
