      result: pass
      artifact: D:\kjv-educator\.tmp\mobile-click-audit\focused-highlight-screen-3.xml
      finding: "Verified 강조 구절, 전체 색상, 성경 권, 전체 성경, 열기, 복사, 해제, and highlighted verse body text."
  divergence:
